// Regenerate Python stubs: python3 -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. judger.proto
syntax = "proto3";

package yukticode.judger;

// The backend server implements this interface, and the workers call it.
service JudgeCoordinator {
    // 1. Standard Code Submission (Unary RPC)
    // One request from the worker, one response from the backend.
    rpc ReportSubmitVerdict (SubmitVerdictRequest) returns (ReportResponse);

    // 2. Single Custom Run (Unary RPC)
    rpc ReportRunVerdict (RunVerdictRequest) returns (ReportResponse);

    // 3. Batch Custom Run (Client-Streaming RPC)
    // The worker opens a single persistent HTTP/2 connection and streams 
    // RunVerdictRequest messages one by one as each test case finishes.
    rpc StreamBatchRunVerdict (stream RunVerdictRequest) returns (ReportResponse);
}

// Payload for standard problem submissions (POST /submit)
message SubmitVerdictRequest {
    string submission_id = 1;
    string status = 2;               // e.g., "AC", "WA", "TLE"
    double execution_time_ms = 3;
    double peak_memory_mb = 4;
}

// Payload for custom test case runs (POST /run and POST /run_batch)
message RunVerdictRequest {
    string run_id = 1;               // Can be the run_id OR the batch_id
    string status = 2;
    string std_out = 3;              // Actual output of the code
    double execution_time_ms = 4;
    double peak_memory_mb = 5;
    
    // Crucial for streaming: Tells the frontend WHICH tab/test case just finished
    int32 test_index = 6;
}

// Standard acknowledgment from the backend
message ReportResponse {
    bool success = 1;
    string message = 2;
}
